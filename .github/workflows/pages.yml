# 把站点导出成静态文件并发到 GitHub Pages。
#
# 首次启用：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
#
# 两个可选变量在 Settings → Secrets and variables → Actions → Variables 里配：
#   PAGES_BASE_PATH  项目仓库要填 "/仓库名"；仓库叫 <用户名>.github.io 就不用填
#   SITE_URL         正式域名，例如 https://gaozelin.github.io/portfolio-site，
#                    用来写 canonical 和 og:url；不填就留 localhost，不影响页面显示
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，新的推送把排队中的旧任务顶掉
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 ci 而不是 install：install 会改写 lock 文件里的平台相关依赖
      - run: npm ci

      - run: npm run lint
      - run: npm test

      - run: npm run export
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
